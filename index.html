<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1430" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="uru-mon" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <title>uru-mon: a Bengaluru adventure</title>
    <meta name="description" content="A creature-collecting adventure across Bengaluru. Catch 150 Urumon in steel tiffin Dabbas and battle from Lalbagh to Nandi Hills. Free in your browser, on phone or desktop." />
    <link rel="canonical" href="https://www.uru-mon.com/" />
    <!-- link previews (WhatsApp, X, Discord, LinkedIn...); the image is made by tools/art/brand.py -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="uru-mon" />
    <meta property="og:url" content="https://www.uru-mon.com/" />
    <meta property="og:title" content="uru-mon: a Bengaluru adventure" />
    <meta property="og:description" content="Catch 150 Urumon in steel tiffin Dabbas and battle from Lalbagh to Nandi Hills. Free in your browser, on phone or desktop." />
    <meta property="og:image" content="https://www.uru-mon.com/assets/icons/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="uru-mon: Vidhana Soudha against the setting sun, with a metro train and jacaranda trees" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <style>
      @font-face {
        font-family: 'Pixelify';
        src: url('assets/fonts/pixelify/PixelifySans.ttf') format('truetype');
        font-weight: 400 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #1c1430;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Pixelify', monospace;
      }
      #game-container {
        position: absolute;
        inset: 0;
      }
      #game-container canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      body { overscroll-behavior: none; }
      /* ---- touch layout --------------------------------------------------------------------------------
         portrait: game on top at full width, the pad under your thumbs, a hint in between.
         landscape: game fills the height; A/B/MENU live in the side margins ("roomy") so nothing covers the game;
         the D-pad is optional (tap-to-walk does the walking). */
      @media (orientation: portrait) {
        body.has-touch-controls #game-container {
          top: env(safe-area-inset-top);
          bottom: auto;
          height: calc(100vw * 9 / 16);
        }
      }
      .touch-pad {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .touch-pad button {
        pointer-events: auto;
        position: absolute;
        border: none;
        font-family: 'Pixelify', monospace;
        color: #f4ecff;
        background: rgba(60, 44, 96, 0.85);
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.35);
        touch-action: none;
      }
      .touch-pad button.held {
        background: rgba(124, 92, 190, 0.95);
        box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.35);
      }
      .pad-hint {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(env(safe-area-inset-top) + 100vw * 9 / 16 + 6vh);
        text-align: center;
        color: #8d7cc4;
        font-size: 15px;
        line-height: 1.7;
        letter-spacing: 0.5px;
        padding: 0 24px;
      }
      .pad-hint .rotate { color: #c8b8ff; font-size: 17px; }
      .msg-mirror {
        position: absolute;
        left: 16px;
        right: 16px;
        top: calc(env(safe-area-inset-top) + 100vw * 9 / 16 + 3vh);
        max-height: calc(100vh - 100vw * 9 / 16 - min(46vw, 200px) - 90px);
        overflow: hidden;
        padding: 16px 18px;
        border-radius: 14px;
        background: #f6f1e6;
        color: #2d2a3a;
        font-size: clamp(17px, 5vw, 22px);
        line-height: 1.45;
        box-shadow: 0 0 0 4px #6c5aa8, 0 6px 18px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      .msg-mirror.on { opacity: 1; pointer-events: auto; }
      .msg-mirror .who { color: #6c5aa8; font-size: 0.8em; letter-spacing: 1px; margin-bottom: 4px; }
      .msg-mirror .who:empty { display: none; }
      @media (orientation: landscape) { .msg-mirror { display: none; } }
      .dpad {
        position: absolute;
        left: max(18px, env(safe-area-inset-left));
        bottom: max(34px, calc(env(safe-area-inset-bottom) + 18px));
        width: min(46vw, 200px);
        height: min(46vw, 200px);
      }
      .dpad .dir { width: 34%; height: 34%; border-radius: 10px; }
      .dpad .up { left: 33%; top: 0; }
      .dpad .down { left: 33%; bottom: 0; }
      .dpad .left { left: 0; top: 33%; }
      .dpad .right { right: 0; top: 33%; }
      .dpad .dir::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        border: 9px solid transparent;
        transform: translate(-50%, -50%);
      }
      .dpad .up::after { border-bottom: 12px solid #f4ecff; border-top: 0; }
      .dpad .down::after { border-top: 12px solid #f4ecff; border-bottom: 0; }
      .dpad .left::after { border-right: 12px solid #f4ecff; border-left: 0; }
      .dpad .right::after { border-left: 12px solid #f4ecff; border-right: 0; }
      .dpad-center {
        position: absolute;
        left: 33%;
        top: 33%;
        width: 34%;
        height: 34%;
        background: rgba(60, 44, 96, 0.85);
      }
      .ab {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(48px, calc(env(safe-area-inset-bottom) + 30px));
        width: min(46vw, 210px);
        height: min(34vw, 150px);
      }
      .ab button {
        width: min(20vw, 86px);
        height: min(20vw, 86px);
        border-radius: 50%;
        font-size: min(7vw, 30px);
        font-weight: 700;
      }
      .ab .a { right: 0; top: 0; background: rgba(196, 64, 74, 0.9); }
      .ab .b { left: 0; bottom: 0; background: rgba(196, 64, 74, 0.65); }
      .sys {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(10px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        pointer-events: none;
      }
      .sys button { position: static; padding: 8px 16px; border-radius: 14px; font-size: 14px; letter-spacing: 1px; }
      .sys .tool { padding: 6px 12px; font-size: 18px; line-height: 1; }
      /* in portrait the D-pad always shows, so its toggle isn't needed */
      @media (orientation: portrait) { .sys .tool[data-tool='dpad'] { display: none; } }

      @media (orientation: landscape) {
        .pad-hint { display: none; }
        .dpad { display: none; width: 150px; height: 150px; opacity: 0.8; bottom: max(12px, env(safe-area-inset-bottom)); }
        body.show-dpad .dpad { display: block; }
        /* overlay mode (little room at the sides, e.g. tablets): small translucent buttons in the corners */
        .ab { width: 150px; height: 112px; bottom: 12px; opacity: 0.8; }
        .ab button { width: 64px; height: 64px; font-size: 24px; }
        .sys { left: max(10px, env(safe-area-inset-left)); top: 8px; bottom: auto; transform: none; flex-direction: row; }
        /* roomy phones: everything in the side margins, nothing over the game */
        body.roomy .ab {
          right: max(6px, env(safe-area-inset-right));
          bottom: auto;
          top: 50%;
          transform: translateY(-50%);
          width: calc(var(--gutter) - 12px);
          height: auto;
          opacity: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 18px;
        }
        body.roomy .ab button {
          position: static;
          width: min(calc(var(--gutter) - 16px), 78px);
          height: min(calc(var(--gutter) - 16px), 78px);
        }
        body.roomy .sys {
          left: max(6px, env(safe-area-inset-left));
          top: 50%;
          transform: translateY(-50%);
          width: calc(var(--gutter) - 12px);
          flex-direction: column;
          align-items: center;
          gap: 14px;
        }
        body.roomy .sys button { width: 100%; max-width: 86px; padding: 10px 0; }
        body.roomy.show-dpad .dpad { left: calc(var(--gutter) + 8px); }
      }
      /* phones held upright: ask for landscape (touch-controls.js adds the overlay; "Play upright anyway" hides it) */
      .rotate-overlay { display: none; }
      @media (orientation: portrait) and (max-width: 600px) {
        body.has-touch-controls:not(.upright-ok) .rotate-overlay {
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          padding: 24px;
          text-align: center;
          background: #160e28;
          color: #fff4d6;
        }
      }
      .rotate-overlay .phone-icon {
        width: 44px;
        height: 76px;
        margin-bottom: 18px;
        border: 4px solid #fff4d6;
        border-radius: 10px;
        animation: uru-rotate 2.6s ease-in-out infinite;
      }
      @keyframes uru-rotate {
        0%, 25% { transform: rotate(0deg); }
        50%, 85% { transform: rotate(-90deg); }
        100% { transform: rotate(0deg); }
      }
      .rotate-title { font-size: 26px; }
      .rotate-sub, .rotate-tip { max-width: 300px; font-size: 16px; line-height: 1.45; color: #cbb8ff; }
      .rotate-tip b { color: #fff4d6; font-weight: 600; }
      .rotate-skip {
        margin-top: 22px;
        padding: 10px 18px;
        border: 2px solid #5b3f8f;
        border-radius: 10px;
        background: none;
        color: #cbb8ff;
        font: inherit;
        font-size: 16px;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cbb8ff;
        font-size: 20px;
        letter-spacing: 2px;
      }
    </style>
    <script src="src/lib/vendor/phaser.min.js"></script>
    <!-- Vercel Web Analytics (cookieless page views). There's no build step, so this is the plain-HTML snippet,
         not the npm package: a bare `import '@vercel/analytics'` can't load in the browser and stops the game.
         Vercel serves the script itself; skipped on localhost, where it doesn't exist. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
        const va = document.createElement('script');
        va.src = '/_vercel/insights/script.js';
        va.defer = true;
        document.head.appendChild(va);
      }
    </script>
  </head>
  <body>
    <div id="boot">loading uru-mon…</div>
    <div id="game-container"></div>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
