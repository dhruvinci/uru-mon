<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1430" />
    <meta name="description" content="uru-mon: a creature-collecting adventure across Bengaluru." />
    <title>uru-mon</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      @font-face {
        font-family: 'Pixelify';
        src: url('assets/fonts/pixelify/PixelifySans.ttf') format('truetype');
        font-weight: 400 700;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #1c1430;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Pixelify', monospace;
      }
      #game-container {
        position: absolute;
        inset: 0;
      }
      #game-container canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* phones in portrait: game pinned to the top at full width, pad fills the rest */
      @media (orientation: portrait) {
        body.has-touch-controls #game-container {
          bottom: auto;
          height: calc(100vw * 9 / 16);
        }
      }

      .touch-pad {
        position: fixed;
        inset: auto 0 0 0;
        height: calc(100vh - 100vw * 9 / 16);
        max-height: 70vh;
        pointer-events: none;
        z-index: 10;
      }
      @media (orientation: portrait) {
        .touch-pad::before {
          content: 'uru-mon';
          position: absolute;
          top: 12%;
          width: 100%;
          text-align: center;
          color: #4a3c78;
          font-size: 28px;
          letter-spacing: 6px;
        }
      }
      @media (orientation: landscape) {
        .touch-pad {
          height: 100%;
          inset: 0;
        }
      }
      .touch-pad button {
        pointer-events: auto;
        position: absolute;
        border: none;
        font-family: 'Pixelify', monospace;
        color: #f4ecff;
        background: rgba(60, 44, 96, 0.78);
        box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.35);
        touch-action: none;
      }
      .touch-pad button.held {
        background: rgba(124, 92, 190, 0.92);
        box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.35);
      }
      .dpad {
        position: absolute;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(24px, env(safe-area-inset-bottom));
        width: min(40vw, 190px);
        height: min(40vw, 190px);
      }
      .dpad .dir {
        width: 34%;
        height: 34%;
        border-radius: 8px;
      }
      .dpad .up { left: 33%; top: 0; }
      .dpad .down { left: 33%; bottom: 0; }
      .dpad .left { left: 0; top: 33%; }
      .dpad .right { right: 0; top: 33%; }
      .dpad .dir::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        border: 9px solid transparent;
        transform: translate(-50%, -50%);
      }
      .dpad .up::after { border-bottom: 12px solid #f4ecff; border-top: 0; }
      .dpad .down::after { border-top: 12px solid #f4ecff; border-bottom: 0; }
      .dpad .left::after { border-right: 12px solid #f4ecff; border-left: 0; }
      .dpad .right::after { border-left: 12px solid #f4ecff; border-right: 0; }
      .dpad-center {
        position: absolute;
        left: 33%;
        top: 33%;
        width: 34%;
        height: 34%;
        background: rgba(60, 44, 96, 0.78);
      }
      .ab {
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(32px, env(safe-area-inset-bottom));
        width: min(44vw, 210px);
        height: min(30vw, 140px);
      }
      .ab button {
        width: min(19vw, 84px);
        height: min(19vw, 84px);
        border-radius: 50%;
        font-size: min(7vw, 30px);
        font-weight: 700;
      }
      .ab .a { right: 0; top: 0; background: rgba(196, 64, 74, 0.85); }
      .ab .b { left: 0; bottom: 0; background: rgba(196, 64, 74, 0.6); }
      .touch-pad .start {
        left: 50%;
        transform: translateX(-50%);
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 8px 18px;
        border-radius: 14px;
        font-size: 14px;
        letter-spacing: 1px;
      }
      @media (orientation: landscape) {
        .touch-pad .start { top: 12px; bottom: auto; }
        .touch-pad button { opacity: 0.85; }
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cbb8ff;
        font-size: 20px;
        letter-spacing: 2px;
      }
    </style>
    <script src="src/lib/vendor/phaser.min.js"></script>
  </head>
  <body>
    <div id="boot">loading uru-mon…</div>
    <div id="game-container"></div>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
